[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "optimization-sandbox-solver"
version = "0.1.0"
description = "Stateless LP solver API for Optimization Sandbox"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "highspy>=1.15,<2",
    "pydantic>=2.8,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.16,<3",
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
